name: tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'dummy-key-for-tests' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r api/requirements.txt

      - name: Backend targeted scripts
        run: |
          python -X utf8 tests/test_c1_api.py
          python -X utf8 tests/test_signal_p1.py
          python -X utf8 tests/test_sentiment_api.py
          python -X utf8 tests/test_signal_p4.py

      - name: Backend accuracy tests
        run: |
          python -X utf8 -m pytest tests/test_accuracy_1.py tests/test_accuracy_2.py tests/test_accuracy_3.py
          python -X utf8 -m pytest tests/test_accuracy_4.py tests/test_accuracy_5.py tests/test_accuracy_6.py tests/test_accuracy_7.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

      - name: Frontend build
        working-directory: frontend
        run: npm run build
